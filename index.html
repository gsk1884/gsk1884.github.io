<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈페이지</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1efe8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2c2c2a;
  }

  /* 홈페이지 콘텐츠 */
  .home {
    text-align: center;
  }
  .home h1 {
    font-size: 28px;
    margin-bottom: 10px;
  }
  .home p {
    color: #6b6a63;
    margin-bottom: 28px;
  }
  #open-calc {
    padding: 14px 28px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #1D9E75;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  #open-calc:hover { background: #178a63; }
  #open-calc:active { transform: scale(0.97); }

  /* 오버레이 & 모달 */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #overlay.show { display: flex; }

  .calc {
    width: 320px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 20px;
    position: relative;
    animation: pop 0.15s ease;
  }
  @keyframes pop {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  #close-calc {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #8a8a82;
    padding: 4px;
    line-height: 1;
  }
  #close-calc:hover { color: #2c2c2a; }

  #display {
    width: 100%;
    box-sizing: border-box;
    text-align: right;
    font-size: 32px;
    padding: 20px 14px;
    margin: 8px 0 14px;
    background: #f6f5f2;
    border: none;
    border-radius: 10px;
    font-family: "SFMono-Regular", Consolas, monospace;
    color: #2c2c2a;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .grid button {
    padding: 18px 0;
    font-size: 19px;
    border-radius: 10px;
    border: none;
    background: #f1efe8;
    color: #2c2c2a;
    cursor: pointer;
    transition: transform 0.05s ease, background 0.15s ease;
  }
  .grid button:hover { background: #e4e2d9; }
  .grid button:active { transform: scale(0.96); }
  .op { background: #faeeda !important; color: #633806; }
  .op:hover { background: #f5e2c1 !important; }
  .eq { background: #1D9E75 !important; color: #ffffff; }
  .eq:hover { background: #178a63 !important; }
  .wide { grid-column: span 2; }
</style>
</head>
<body>

<div class="home">
  <h1>환영합니다</h1>
  <p>아래 버튼을 눌러 계산기를 열어보세요</p>
  <button id="open-calc">🧮 계산기 열기</button>
</div>

<div id="overlay">
  <div class="calc">
    <button id="close-calc">✕</button>
    <input id="display" readonly value="0" />
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
(function(){
  var overlay = document.getElementById('overlay');
  var openBtn = document.getElementById('open-calc');
  var closeBtn = document.getElementById('close-calc');
  var display = document.getElementById('display');
  var grid = document.getElementById('grid');
  var current = '0';
  var prev = null;
  var op = null;
  var resetNext = false;

  openBtn.addEventListener('click', function(){
    overlay.classList.add('show');
  });
  closeBtn.addEventListener('click', function(){
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', function(e){
    if (e.target === overlay) overlay.classList.remove('show');
  });

  var keys = [
    ['C', 'plain'], ['%', 'plain'], ['←', 'plain'], ['÷', 'op'],
    ['7', ''], ['8', ''], ['9', ''], ['×', 'op'],
    ['4', ''], ['5', ''], ['6', ''], ['−', 'op'],
    ['1', ''], ['2', ''], ['3', ''], ['+', 'op'],
    ['0', '', true], ['.', ''], ['=', 'eq']
  ];

  keys.forEach(function(k){
    var btn = document.createElement('button');
    btn.textContent = k[0];
    if (k[2]) btn.classList.add('wide');
    if (k[1] === 'op') btn.classList.add('op');
    if (k[1] === 'eq') btn.classList.add('eq');
    btn.addEventListener('click', function(){ handleKey(k[0]); });
    grid.appendChild(btn);
  });

  document.addEventListener('keydown', function(e){
    if (!overlay.classList.contains('show')) return;
    if (e.key === 'Escape') { overlay.classList.remove('show'); return; }
    var map = { 'Enter': '=', '*': '×', '/': '÷', '-': '−', 'Backspace': '←' };
    var k = map[e.key] || e.key;
    if ('0123456789.+'.includes(k) || ['×','÷','−','=','←','%'].includes(k)) {
      e.preventDefault();
      handleKey(k);
    }
  });

  function formatNum(n){
    if (!isFinite(n)) return 'Error';
    var r = Math.round(n * 1e10) / 1e10;
    return r.toLocaleString('en-US', { maximumFractionDigits: 10 });
  }

  function handleKey(k){
    if (k === 'C') {
      current = '0'; prev = null; op = null; resetNext = false;
    } else if (k === '←') {
      current = current.length > 1 ? current.slice(0, -1) : '0';
    } else if (k === '%') {
      current = String(parseFloat(current) / 100);
    } else if (['÷','×','−','+'].includes(k)) {
      if (op && !resetNext) compute();
      prev = parseFloat(current);
      op = k;
      resetNext = true;
    } else if (k === '=') {
      compute();
      op = null;
    } else if (k === '.') {
      if (resetNext) { current = '0.'; resetNext = false; }
      else if (!current.includes('.')) current += '.';
    } else {
      if (resetNext || current === '0') { current = k; resetNext = false; }
      else current += k;
    }
    display.value = current;
  }

  function compute(){
    if (prev === null || op === null) return;
    var cur = parseFloat(current);
    var result;
    if (op === '÷') result = prev / cur;
    else if (op === '×') result = prev * cur;
    else if (op === '−') result = prev - cur;
    else result = prev + cur;
    current = formatNum(result);
    prev = parseFloat(current);
    resetNext = true;
  }
})();
</script>

</body>
</html>
