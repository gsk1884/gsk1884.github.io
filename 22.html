<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1efe8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .calc {
    width: 320px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
    padding: 20px;
  }
  #display {
    width: 100%;
    box-sizing: border-box;
    text-align: right;
    font-size: 32px;
    padding: 20px 14px;
    margin-bottom: 14px;
    background: #f6f5f2;
    border: none;
    border-radius: 10px;
    font-family: "SFMono-Regular", Consolas, monospace;
    color: #2c2c2a;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    padding: 18px 0;
    font-size: 19px;
    border-radius: 10px;
    border: none;
    background: #f1efe8;
    color: #2c2c2a;
    cursor: pointer;
    transition: transform 0.05s ease, background 0.15s ease;
  }
  button:hover { background: #e4e2d9; }
  button:active { transform: scale(0.96); }
  .op { background: #faeeda; color: #633806; }
  .op:hover { background: #f5e2c1; }
  .eq { background: #1D9E75; color: #ffffff; }
  .eq:hover { background: #178a63; }
  .wide { grid-column: span 2; }
</style>
</head>
<body>

<div class="calc">
  <input id="display" readonly value="0" />
  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
  var display = document.getElementById('display');
  var grid = document.getElementById('grid');
  var current = '0';
  var prev = null;
  var op = null;
  var resetNext = false;

  var keys = [
    ['C', 'plain'], ['%', 'plain'], ['←', 'plain'], ['÷', 'op'],
    ['7', ''], ['8', ''], ['9', ''], ['×', 'op'],
    ['4', ''], ['5', ''], ['6', ''], ['−', 'op'],
    ['1', ''], ['2', ''], ['3', ''], ['+', 'op'],
    ['0', '', true], ['.', ''], ['=', 'eq']
  ];

  keys.forEach(function(k){
    var btn = document.createElement('button');
    btn.textContent = k[0];
    if (k[2]) btn.classList.add('wide');
    if (k[1] === 'op') btn.classList.add('op');
    if (k[1] === 'eq') btn.classList.add('eq');
    btn.addEventListener('click', function(){ handleKey(k[0]); });
    grid.appendChild(btn);
  });

  document.addEventListener('keydown', function(e){
    var map = { 'Enter': '=', '*': '×', '/': '÷', '-': '−', 'Backspace': '←' };
    var k = map[e.key] || e.key;
    if ('0123456789.+'.includes(k) || ['×','÷','−','=','←','%'].includes(k)) {
      e.preventDefault();
      handleKey(k === '+' ? '+' : k);
    } else if (e.key === 'Escape') {
      handleKey('C');
    }
  });

  function formatNum(n){
    if (!isFinite(n)) return 'Error';
    var r = Math.round(n * 1e10) / 1e10;
    return r.toLocaleString('en-US', { maximumFractionDigits: 10 });
  }

  function handleKey(k){
    if (k === 'C') {
      current = '0'; prev = null; op = null; resetNext = false;
    } else if (k === '←') {
      current = current.length > 1 ? current.slice(0, -1) : '0';
    } else if (k === '%') {
      current = String(parseFloat(current) / 100);
    } else if (['÷','×','−','+'].includes(k)) {
      if (op && !resetNext) compute();
      prev = parseFloat(current);
      op = k;
      resetNext = true;
    } else if (k === '=') {
      compute();
      op = null;
    } else if (k === '.') {
      if (resetNext) { current = '0.'; resetNext = false; }
      else if (!current.includes('.')) current += '.';
    } else {
      if (resetNext || current === '0') { current = k; resetNext = false; }
      else current += k;
    }
    display.value = current;
  }

  function compute(){
    if (prev === null || op === null) return;
    var cur = parseFloat(current);
    var result;
    if (op === '÷') result = prev / cur;
    else if (op === '×') result = prev * cur;
    else if (op === '−') result = prev - cur;
    else result = prev + cur;
    current = formatNum(result);
    prev = parseFloat(current);
    resetNext = true;
  }
})();
</script>

</body>
</html>
